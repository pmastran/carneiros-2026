<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10191e"><meta name="description" content="Protocolo Zero 40+ — caminhar, evoluir e cuidar de si."><link rel="manifest" href="./manifest.webmanifest"><title>Protocolo Zero 40+</title><style>
:root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,sans-serif;background:#10191e;color:#f2f8f4}*{box-sizing:border-box}body{margin:0}main{max-width:650px;margin:auto;padding:24px 16px 105px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.brand{display:flex;align-items:center;gap:12px}.logo{background:#b9ef79;color:#15231b;padding:12px;border-radius:14px;font-weight:900}.eyebrow{font-size:10px;letter-spacing:2px;color:#b9ef79;font-weight:700}h1{font-size:22px;margin:0}h2{font-size:24px;margin:0 0 8px}h3{margin:0 0 12px;font-size:17px}p{color:#c2d0ce;line-height:1.5}small,.muted{color:#a8bcb9}.tag{border:1px solid #536459;padding:6px 10px;border-radius:99px;font-size:11px}.hero{background:linear-gradient(130deg,#314d40,#19282d 65%);padding:25px;border-radius:20px;margin-bottom:16px}.hero strong{font-size:27px;display:block;margin:12px 0}.card{background:#203038;padding:18px;border-radius:18px;margin-bottom:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{background:#203038;border-radius:16px;padding:16px}.metric b{font-size:24px;display:block;margin:9px 0}.metric span{font-size:12px;color:#aebfbd}.accent{color:#b9ef79}button{border:0;border-radius:12px;background:#b9ef79;color:#15241b;padding:13px 16px;font-weight:800;font-size:14px;cursor:pointer}button.secondary{background:#334b41;color:#e9f4ed}button.danger{background:#49302e;color:#ffd4c8}button:disabled{opacity:.5}input,select{width:100%;padding:13px;border:1px solid #4a5f62;background:#17272e;color:white;border-radius:11px;font-size:16px}label{font-size:13px;color:#d9e6e3;display:block;margin:12px 0 6px}.wide{width:100%}.stack{display:grid;gap:10px}.item{border-bottom:1px solid #435158;padding:12px 0;display:flex;justify-content:space-between;align-items:center;gap:12px}.item:last-child{border:0}nav{position:fixed;bottom:0;left:0;right:0;background:#17252b;border-top:1px solid #39484b;display:flex;justify-content:center;padding:8px 5px max(8px,env(safe-area-inset-bottom));z-index:5}nav button{border:0;background:transparent;color:#b1c2c0;font-size:11px;font-weight:600;flex:1;max-width:120px;padding:9px 2px}nav button.active{color:#b9ef79;background:#2b4136}nav span{display:block;font-size:21px;margin-bottom:3px}.hidden{display:none!important}.note{font-size:12px}.status{background:#304338;border-radius:12px;padding:12px;color:#d7f5d0;font-size:13px}.row{display:flex;gap:9px;align-items:center}.row>*{flex:1}a{color:#b9ef79}#map{height:260px;border-radius:15px;background:#15272a;display:grid;place-items:center;overflow:hidden}svg{width:100%;height:100%}
</style></head><body><main><header><div class="brand"><div class="logo">Z+</div><div><div class="eyebrow">PROTOCOLO</div><h1>ZERO 40+</h1></div></div><div class="tag">BETA 0.6</div></header><div id="app"></div></main><nav id="nav"></nav><script>
const KEY='zero40-v06';let data;try{data=JSON.parse(localStorage.getItem(KEY))||{walks:[],profile:{},strength:0}}catch{data={walks:[],profile:{},strength:0}};let tab='inicio',watch=null,track=[],started=0,walkMeters=0;const $=s=>document.querySelector(s),num=x=>Number(x)||0,fmt=n=>n.toLocaleString('pt-BR',{maximumFractionDigits:2}),save=()=>localStorage.setItem(KEY,JSON.stringify(data)),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),pace=(m,k)=>k>0?(Math.floor(m/k)+':'+String(Math.round(((m/k)%1)*60)).padStart(2,'0')):'—';const tabs=[['inicio','⌂','Início'],['caminhar','◉','Caminhar'],['coach','✦','Coach'],['treinos','✚','Exercícios'],['perfil','☷','Mapa Zero']];function nav(){ $('#nav').innerHTML=tabs.map(t=>'<button class="'+(tab===t[0]?'active':'')+'" onclick="go(\''+t[0]+'\')"><span>'+t[1]+'</span>'+t[2]+'</button>').join('')}function go(t){tab=t;render();window.scrollTo(0,0)}function render(){nav();const walks=data.walks,km=walks.reduce((a,w)=>a+w.km,0),min=walks.reduce((a,w)=>a+w.min,0),steps=walks.reduce((a,w)=>a+w.steps,0);let h='';if(tab==='inicio'){h='<section class="hero"><div class="eyebrow">SEU NOVO COMEÇO</div><strong>O próximo passo é seu.</strong><p>Mais que acompanhar atividades. Entender como evoluir.</p><button onclick="go(\'caminhar\')">Registrar caminhada →</button></section><div class="grid"><div class="metric"><span>👣 PASSOS</span><b>'+fmt(steps)+'</b><span>registrados</span></div><div class="metric"><span>↗ DISTÂNCIA</span><b>'+fmt(km)+' km</b><span>total</span></div><div class="metric"><span>◷ TEMPO</span><b>'+fmt(min)+' min</b><span>de caminhada</span></div><div class="metric"><span>◉ RITMO</span><b>'+pace(min,km)+'</b><span>min/km</span></div></div><div class="card" style="margin-top:12px"><h3 class="accent">✦ Insight Zero</h3><p>'+(walks.length?'Você já registrou '+walks.length+' caminhada(s). Observe sua regularidade, esforço e recuperação antes de aumentar a intensidade.':'Registre sua primeira caminhada para começar a acompanhar sua evolução.')+'</p><button class="secondary wide" onclick="go(\'coach\')">Ver análise</button></div>'}
if(tab==='caminhar'){h='<h2>Caminhadas</h2><p>Registre pelo Samsung Health ou experimente o GPS enquanto a tela estiver ativa.</p><div class="card"><h3>Registrar manualmente</h3><label>Distância (km)</label><input id="km" type="number" inputmode="decimal" min="0.01" step=".01" placeholder="Ex.: 4.5"><div class="row"><div><label>Tempo (min)</label><input id="min" type="number" inputmode="numeric" min="1" placeholder="52"></div><div><label>Passos</label><input id="steps" type="number" inputmode="numeric" min="0" placeholder="6200"></div></div><label>Esforço percebido</label><select id="effort"><option value="leve">Leve</option><option value="moderado">Moderado</option><option value="alto">Intenso</option></select><p><button class="wide" onclick="addWalk()">Salvar caminhada</button></p></div><div class="card"><h3>GPS experimental</h3><div id="gpsinfo" class="status">Pronto para iniciar. Requer HTTPS e permissão de localização.</div><p><div class="row"><button id="gpsbtn" onclick="startGps()">Iniciar GPS</button><button class="secondary" onclick="stopGps()">Parar</button></div></p><div id="map"><span class="muted">O percurso aparecerá aqui.</span></div><p class="note">O GPS do navegador pode pausar ao bloquear a tela. Não use como medidor de segurança ou precisão profissional.</p></div><div class="card"><h3>Histórico</h3>'+(walks.length?walks.map(w=>'<div class="item"><div><b>'+fmt(w.km)+' km · '+fmt(w.min)+' min</b><div class="muted note">'+esc(w.date)+' · '+fmt(w.steps)+' passos · '+esc(w.effort)+'</div></div><button class="danger" onclick="removeWalk(\''+w.id+'\')">Excluir</button></div>').join(''):'<p>Nenhuma caminhada registrada.</p>')+'</div>'}
if(tab==='coach'){let r=[];if(!walks.length)r.push('Registre uma caminhada para começar a análise.');else r.push('Você acumulou '+fmt(km)+' km em '+walks.length+' caminhada(s), com ritmo médio de '+pace(min,km)+' min/km.');if(data.profile.risk==='sim')r.push('Você relatou sintomas ou restrições não avaliadas. Procure avaliação profissional antes de iniciar ou intensificar exercícios.');else{r.push('Priorize constância e progressão gradual, sem aumentar volume e intensidade ao mesmo tempo.');if(walks.some(w=>w.effort==='alto'))r.push('Há registro de esforço intenso. Observe a recuperação antes da próxima sessão.');if(!data.strength)r.push('Ainda não há exercícios de força registrados. Avalie incluir fortalecimento apropriado à sua condição.')}h='<h2>Coach Zero</h2><p>Interpretação educativa baseada nos dados que você registrou.</p><div class="card"><h3>Suas observações</h3>'+r.map(x=>'<p>✓ '+x+'</p>').join('')+'</div><div class="card"><h3>Fortalecimento</h3><p>Sessões marcadas: <b class="accent">'+data.strength+'</b></p><button onclick="data.strength++;save();render()">+ Registrar sessão</button></div><p class="note">Regras automáticas, não inteligência artificial clínica nem aconselhamento médico.</p>'}
if(tab==='treinos'){h='<h2>Força e mobilidade</h2><p>Movimentos introdutórios. Adapte à sua capacidade e interrompa se houver dor ou sintomas.</p>'+[['Sentar e levantar','6 a 8 repetições','Use cadeira firme e apoio se necessário.'],['Mobilidade dos ombros','1 a 2 minutos','Movimentos suaves e sem forçar amplitudes.'],['Elevar calcanhares','8 a 10 repetições','Segure apoio estável e movimente-se lentamente.']].map(x=>'<div class="card"><h3>'+x[0]+'</h3><b class="accent">'+x[1]+'</b><p>'+x[2]+'</p></div>').join('')+'<div class="card"><button class="wide" onclick="data.strength++;save();alert(\'Sessão registrada!\')">Marcar sessão concluída</button></div>'}
if(tab==='perfil'){let p=data.profile;h='<h2>Mapa Zero</h2><p>Seu ponto de partida orienta a experiência.</p><div class="card"><label>Objetivo principal</label><select id="goal"><option value="condicionamento">Melhorar condicionamento</option><option value="peso">Composição corporal</option><option value="forca">Ganhar força e mobilidade</option><option value="habitos">Criar hábitos saudáveis</option></select><label>Rotina atual</label><select id="level"><option value="iniciante">Começando do zero</option><option value="ocasional">Atividade ocasional</option><option value="regular">Rotina regular</option></select><label>Tem sintomas preocupantes ou restrições não avaliadas?</label><select id="risk"><option value="nao">Não</option><option value="sim">Sim</option></select><p><button class="wide" onclick="saveProfile()">Salvar Mapa Zero</button></p></div><div class="card"><h3>Seus dados</h3><p>Salvos neste navegador. Não são sincronizados com a nuvem.</p><button class="secondary wide" onclick="exportData()">Exportar backup JSON</button></div>';setTimeout(()=>{if($('#goal')){$('#goal').value=p.goal||'condicionamento';$('#level').value=p.level||'iniciante';$('#risk').value=p.risk||'nao'}},0)}$('#app').innerHTML=h;if(tab==='caminhar'&&watch!==null)gpsUI()}
function addWalk(){let k=num($('#km').value),m=num($('#min').value),s=num($('#steps').value);if(k<=0||m<=0||s<0||!Number.isFinite(k)||!Number.isFinite(m)){alert('Informe distância e tempo válidos.');return}data.walks.unshift({id:String(Date.now()),km:k,min:m,steps:s,effort:$('#effort').value,date:new Date().toLocaleDateString('pt-BR')});save();render()}function removeWalk(id){if(!confirm('Excluir esta caminhada?'))return;data.walks=data.walks.filter(w=>w.id!==id);save();render()}function saveProfile(){data.profile={goal:$('#goal').value,level:$('#level').value,risk:$('#risk').value};save();alert('Mapa Zero salvo!')}function exportData(){let b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='zero40-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)}
function dist(a,b){const R=6371000,rad=Math.PI/180,dLat=(b.lat-a.lat)*rad,dLon=(b.lon-a.lon)*rad,z=Math.sin(dLat/2)**2+Math.cos(a.lat*rad)*Math.cos(b.lat*rad)*Math.sin(dLon/2)**2;return 2*R*Math.asin(Math.sqrt(z))}function startGps(){if(watch!==null)return;if(!navigator.geolocation){alert('GPS não disponível neste navegador.');return}track=[];walkMeters=0;started=Date.now();watch=navigator.geolocation.watchPosition(p=>{let pt={lat:p.coords.latitude,lon:p.coords.longitude,accuracy:p.coords.accuracy};if(pt.accuracy>80)return;if(track.length){let d=dist(track[track.length-1],pt);if(d>1&&d<120)walkMeters+=d}track.push(pt);gpsUI()},e=>{if($('#gpsinfo'))$('#gpsinfo').textContent='GPS: '+e.message},{enableHighAccuracy:true,maximumAge:0,timeout:20000});gpsUI()}function gpsUI(){let s=$('#gpsinfo');if(s)s.textContent='GPS ativo · '+fmt(walkMeters/1000)+' km · '+Math.max(0,Math.round((Date.now()-started)/60000))+' min · '+track.length+' pontos';let m=$('#map');if(m&&track.length){let lat=track.map(x=>x.lat),lon=track.map(x=>x.lon),a=Math.min(...lon),b=Math.max(...lon),c=Math.min(...lat),d=Math.max(...lat),points=track.map(p=>((p.lon-a)/(b-a||.0001)*90+5)+','+(95-(p.lat-c)/(d-c||.0001)*90)).join(' ');m.innerHTML='<svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet"><rect width="100" height="100" fill="#19332e"/><polyline points="'+points+'" fill="none" stroke="#b9ef79" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="'+points.split(' ').at(-1).split(',')[0]+'" cy="'+points.split(' ').at(-1).split(',')[1]+'" r="2.5" fill="#fff"/></svg>'}}function stopGps(){if(watch===null)return;navigator.geolocation.clearWatch(watch);watch=null;let mins=Math.max(1,Math.round((Date.now()-started)/60000)),km=+(walkMeters/1000).toFixed(3);if(km>.02&&confirm('Salvar percurso GPS de '+fmt(km)+' km?')){data.walks.unshift({id:String(Date.now()),km,min:mins,steps:0,effort:'não informado',date:new Date().toLocaleDateString('pt-BR')});save()}render()}render();if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
